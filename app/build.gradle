apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.kapt'

def mojiSigningPropertiesPath = System.getenv('MOJI_SIGNING_PROPERTIES')
def mojiSigningProperties = new Properties()
if (mojiSigningPropertiesPath) {
    def mojiSigningPropertiesFile = file(mojiSigningPropertiesPath)
    if (!mojiSigningPropertiesFile.isFile()) {
        throw new GradleException('MOJI_SIGNING_PROPERTIES does not point to a readable file')
    }
    mojiSigningPropertiesFile.withInputStream { mojiSigningProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!mojiSigningProperties.getProperty(key)) {
            throw new GradleException("Missing release signing property: ${key}")
        }
    }
}

kapt {
    arguments {
        arg('room.schemaLocation', "$projectDir/schemas")
    }
}

android {
    namespace 'com.moji.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.moji.app'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '1.3.2'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    signingConfigs {
        if (mojiSigningPropertiesPath) {
            release {
                storeFile file(mojiSigningProperties.getProperty('storeFile'))
                storePassword mojiSigningProperties.getProperty('storePassword')
                keyAlias mojiSigningProperties.getProperty('keyAlias')
                keyPassword mojiSigningProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (mojiSigningPropertiesPath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// The workspace path contains Chinese characters. The Windows Java launcher reads
// Gradle worker argfiles using the active code page before -Dfile.encoding applies,
// so unit-test class directories can become unreadable. Package only project test
// classes into the ASCII-only Gradle user home before starting the test worker.
def mojiAsciiTestDir = new File(gradle.gradleUserHomeDir, 'moji-test-runtime')
tasks.register('jarDebugUnitTestClasses', Jar) {
    dependsOn 'compileDebugUnitTestKotlin'
    from "$buildDir/tmp/kotlin-classes/debugUnitTest"
    archiveFileName = 'moji-debug-tests.jar'
    destinationDirectory = mojiAsciiTestDir
}
tasks.register('copyDebugMainClasses', Copy) {
    dependsOn 'bundleDebugClassesToRuntimeJar'
    from "$buildDir/intermediates/runtime_app_classes_jar/debug/bundleDebugClassesToRuntimeJar/classes.jar"
    into mojiAsciiTestDir
    rename { 'moji-debug-main.jar' }
}
tasks.register('jarReleaseUnitTestClasses', Jar) {
    dependsOn 'compileReleaseUnitTestKotlin'
    from "$buildDir/tmp/kotlin-classes/releaseUnitTest"
    archiveFileName = 'moji-release-tests.jar'
    destinationDirectory = mojiAsciiTestDir
}
tasks.register('copyReleaseMainClasses', Copy) {
    dependsOn 'bundleReleaseClassesToRuntimeJar'
    from "$buildDir/intermediates/runtime_app_classes_jar/release/bundleReleaseClassesToRuntimeJar/classes.jar"
    into mojiAsciiTestDir
    rename { 'moji-release-main.jar' }
}
afterEvaluate {
    tasks.named('testDebugUnitTest').configure {
        dependsOn 'jarDebugUnitTestClasses', 'copyDebugMainClasses'
        doFirst {
            classpath = files(
                new File(mojiAsciiTestDir, 'moji-debug-tests.jar'),
                new File(mojiAsciiTestDir, 'moji-debug-main.jar')
            ) + classpath.filter { !it.absolutePath.startsWith(buildDir.absolutePath) }
        }
    }
    tasks.named('testReleaseUnitTest').configure {
        dependsOn 'jarReleaseUnitTestClasses', 'copyReleaseMainClasses'
        doFirst {
            classpath = files(
                new File(mojiAsciiTestDir, 'moji-release-tests.jar'),
                new File(mojiAsciiTestDir, 'moji-release-main.jar')
            ) + classpath.filter { !it.absolutePath.startsWith(buildDir.absolutePath) }
        }
    }
}
